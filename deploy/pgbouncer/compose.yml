services:
  marketplace-db:
    build: .
    restart: unless-stopped
    ports:
      - "187.53.134.195:6432:6432"
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - /root/.arise-marketplace/pgbouncer:/run/marketplace:ro
    networks:
      - arisesell
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "6432"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  arisesell:
    external: true
    name: backend_default
