[databases]
arisesell_db = host=arisesell-postgres port=5432 dbname=arisesell_db pool_size=12 max_db_connections=12

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir = /tmp
auth_type = scram-sha-256
auth_file = /run/marketplace/userlist.txt
; SQLx sends this at startup; PostgreSQL 16 already uses precise float output.
ignore_startup_parameters = extra_float_digits
client_tls_sslmode = verify-full
client_tls_ca_file = /run/marketplace/ca.crt
client_tls_cert_file = /run/marketplace/server.crt
client_tls_key_file = /run/marketplace/server.key
client_tls_protocols = secure
; PostgreSQL stays on the existing private Docker network without a published port.
server_tls_sslmode = disable
pool_mode = session
default_pool_size = 12
max_client_conn = 100
query_wait_timeout = 15
server_connect_timeout = 5
server_idle_timeout = 60
client_login_timeout = 10
log_connections = 0
log_disconnections = 0
