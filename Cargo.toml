[package]
name = "arise-digital-store"
version = "0.1.0"
edition = "2024"
default-run = "arise-digital-store"

[[bin]]
name = "marketplace-api"
path = "api/app.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "sqlite"] }
vercel_runtime = { version = "2.4", features = ["axum"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
url = "2"
dotenvy = "0.15"

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
